version: 2

models:
  - name: int_order_line_items
    description: "Enriched order line item model combining order headers with line item shipping and revenue metrics."
    columns:
      - name: order_key
        description: "Order identifier from TPCH orders."
        tests:
          - not_null

      - name: line_number
        description: "Line number within the order."
        tests:
          - not_null

      - name: customer_key
        description: "Customer associated with the order."
        tests:
          - not_null

      - name: part_key
        description: "Part associated with the order line."
        tests:
          - not_null

      - name: supplier_key
        description: "Supplier associated with the order line."
        tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null

      - name: ship_date
        description: "Date when the order line was shipped."
        tests:
          - not_null

      - name: receipt_date
        description: "Date when the order line was received."
        tests:
          - not_null

      - name: net_item_revenue
        description: "Line item revenue after discount."
        tests:
          - not_null

      - name: is_late_shipment
        description: "Boolean flag showing whether ship date is later than commit date."
        tests:
          - not_null