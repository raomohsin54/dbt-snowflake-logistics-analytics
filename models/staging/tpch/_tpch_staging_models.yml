version: 2

models:
  - name: stg_tpch__customers
    description: "Cleaned customer master data from TPCH sample data."
    columns:
      - name: customer_key
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique
      - name: customer_name
        description: "Customer name."
        tests:
          - not_null
      - name: nation_key
        description: "Foreign key to nation."
        tests:
          - not_null
      - name: market_segment
        description: "Customer market segment."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUILDING', 'AUTOMOBILE', 'MACHINERY', 'HOUSEHOLD', 'FURNITURE']

  - name: stg_tpch__orders
    description: "Cleaned order header data."
    columns:
      - name: order_key
        description: "Unique order identifier."
        tests:
          - not_null
          - unique
      - name: customer_key
        description: "Foreign key to customer."
        tests:
          - not_null
      - name: order_status
        description: "Order status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']
      - name: order_date
        description: "Date the order was placed."
        tests:
          - not_null

  - name: stg_tpch__line_items
    description: "Cleaned order line item data including shipping and revenue fields."
    columns:
      - name: order_key
        description: "Foreign key to order."
        tests:
          - not_null
      - name: part_key
        description: "Foreign key to part."
        tests:
          - not_null
      - name: supplier_key
        description: "Foreign key to supplier."
        tests:
          - not_null
      - name: line_number
        description: "Line number within an order."
        tests:
          - not_null
      - name: ship_date
        description: "Date the item was shipped."
        tests:
          - not_null
      - name: commit_date
        description: "Committed shipping date."
        tests:
          - not_null
      - name: receipt_date
        description: "Date the item was received."
        tests:
          - not_null
      - name: net_item_revenue
        description: "Extended price after discount."
        tests:
          - not_null

  - name: stg_tpch__suppliers
    description: "Cleaned supplier master data."
    columns:
      - name: supplier_key
        description: "Unique supplier identifier."
        tests:
          - not_null
          - unique
      - name: supplier_name
        description: "Supplier name."
        tests:
          - not_null
      - name: nation_key
        description: "Foreign key to nation."
        tests:
          - not_null

  - name: stg_tpch__parts
    description: "Cleaned part/product master data."
    columns:
      - name: part_key
        description: "Unique part identifier."
        tests:
          - not_null
          - unique
      - name: part_name
        description: "Part name."
        tests:
          - not_null
      - name: retail_price
        description: "Retail price of the part."
        tests:
          - not_null

  - name: stg_tpch__part_suppliers
    description: "Cleaned mapping between parts and suppliers."
    columns:
      - name: part_key
        description: "Foreign key to part."
        tests:
          - not_null
      - name: supplier_key
        description: "Foreign key to supplier."
        tests:
          - not_null
      - name: available_quantity
        description: "Available quantity from the supplier."
        tests:
          - not_null
      - name: supply_cost
        description: "Supplier cost for the part."
        tests:
          - not_null

  - name: stg_tpch__nations
    description: "Cleaned nation lookup table."
    columns:
      - name: nation_key
        description: "Unique nation identifier."
        tests:
          - not_null
          - unique
      - name: nation_name
        description: "Nation name."
        tests:
          - not_null
      - name: region_key
        description: "Foreign key to region."
        tests:
          - not_null

  - name: stg_tpch__regions
    description: "Cleaned region lookup table."
    columns:
      - name: region_key
        description: "Unique region identifier."
        tests:
          - not_null
          - unique
      - name: region_name
        description: "Region name."
        tests:
          - not_null