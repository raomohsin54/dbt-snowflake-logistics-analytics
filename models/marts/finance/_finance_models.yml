version: 2

models:
  - name: fct_order_line_items
    description: "Fact table at order-line grain for logistics, shipping, and revenue analytics."
    columns:
      - name: order_line_item_key
        description: "Surrogate key generated from order_key and line_number."
        tests:
          - not_null
          - unique

      - name: order_key
        description: "Order identifier."
        tests:
          - not_null

      - name: line_number
        description: "Line number within the order."
        tests:
          - not_null

      - name: customer_key
        description: "Customer associated with the order."
        tests:
          - not_null

      - name: part_key
        description: "Part associated with the order line."
        tests:
          - not_null

      - name: supplier_key
        description: "Supplier associated with the order line."
        tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null

      - name: net_item_revenue
        description: "Revenue after discount at line-item level."
        tests:
          - not_null

      - name: gross_item_revenue
        description: "Revenue after discount and tax at line-item level."
        tests:
          - not_null

      - name: is_late_shipment
        description: "Boolean flag showing whether the shipment was late against commit date."
        tests:
          - not_null